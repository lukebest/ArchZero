[project]
name = "archzero"
version = "0.1.0"
description = "Idea Factory for computer architecture — Generation + multi-tier Evaluation (telemetry deferred)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cursor-sdk>=0.1.0",
  "pydantic>=2.0",
  "typer>=0.12",
  "rich>=13.0",
  "httpx>=0.27",
  "pypdf>=4.0",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "aiofiles>=24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
archzero = "archzero.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archzero"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "directed: directed sim backend smoke (offline)",
  "ensemble: Tier2 ensemble_n>1 smoke",
  "paper: paper-profile config checks",
  "champsim: optional ChampSim binary smoke",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false

[tool.uv]
package = true
