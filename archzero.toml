# ArchZero Idea Factory configuration

[pools]
preferred_cursor = "cursor-grok-4.6-high-fast"
preferred_other = "cursor-grok-4.6-high-fast"
cursor_models = ["cursor-grok-4.6-high-fast", "cursor-grok-4.6", "cursor-grok-4.5-high-fast", "composer-2.5"]

[budget]
other_pool_max_tokens = 2000000
other_pool_max_calls = 200
concurrency = 4

[quotas]
# Single-spec target shape: ~1K enter T0 → ~100 after T1 → ~10 after T2.
tier0_keep = 1000
tier1_keep = 100
tier2_keep = 10
tier3_keep = 5
tier4_keep = 3
tier5_keep = 2
tier6_keep = 2

[funnel]
strict_evidence = true
ensemble_n = 1
# T1 veto restored: FAIL blocks T2 so the funnel can cut ~1K → ~100.
tier1_advisory = false
tier0_batch_size = 10

[divergence]
# Cross-domain mass ideation before Tier0. n_cells LLM calls -> n_cells*per_cell ideas.
enabled = true
n_cells = 24
per_cell = 8

[seed_library]
# No-LLM mechanism×DOF grid supplies Tier0 volume; merged with diverge.
enabled = true
target_n = 1000

[patent]
# Optional module. pptx rendering needs: uv sync --extra patent
search_enabled = true
max_hits = 15

[sim]
backend = "champsim"
champsim_bin = "tools/champsim/bin/champsim"
gem5_bin = "tools/gem5/build/X86/gem5.opt"
traces_dir = "benchmarks/traces"

[rtl]
pycircuit_root = "vendor/pycircuit"
pyc_toolchain_root = ".pycircuit_out/toolchain/install"

[sign]
enabled = false

[evolve]
backend = "mapelites"
islands = 3
generations = 10
