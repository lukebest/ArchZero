# ArchZero Idea Factory configuration

[pools]
preferred_cursor = "cursor-grok-4.6-high-fast"
preferred_other = "cursor-grok-4.6-high-fast"
cursor_models = ["cursor-grok-4.6-high-fast", "cursor-grok-4.6", "cursor-grok-4.5-high-fast", "composer-2.5"]

[budget]
other_pool_max_tokens = 2000000
other_pool_max_calls = 200
concurrency = 4

[quotas]
# Prefer a few dozen spec-shaped ideas over a 1K knob grid.
tier0_keep = 80
tier1_keep = 40
tier2_keep = 10
tier3_keep = 5
tier4_keep = 3
tier5_keep = 2
tier6_keep = 2

[funnel]
strict_evidence = true
ensemble_n = 1
tier1_advisory = false
tier0_batch_size = 10

[divergence]
# 12 cells × 6 ideas — LLM writes four-part hardware mechanisms against the spec.
enabled = true
n_cells = 12
per_cell = 6

[seed_library]
# Knob-grid volume fails T0 physics on this NoC spec. Off unless explicitly enabled.
enabled = false
target_n = 80

[patent]
# Optional module. pptx rendering needs: uv sync --extra patent
search_enabled = true
max_hits = 15

[sim]
backend = "champsim"
champsim_bin = "tools/champsim/bin/champsim"
gem5_bin = "tools/gem5/build/X86/gem5.opt"
traces_dir = "benchmarks/traces"

[rtl]
pycircuit_root = "vendor/pycircuit"
pyc_toolchain_root = ".pycircuit_out/toolchain/install"

[sign]
enabled = false

[evolve]
backend = "mapelites"
islands = 3
generations = 10
